<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <!-- Default theme: respect saved preference; otherwise start DARK -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored ? stored : "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sentient Partners | Global Experience. Local Impact.</title>
    <meta
      name="description"
      content="Sentient Partners is a founder-led business advisory and technology implementation partner in Auburn, California, bringing global enterprise experience to local businesses."
    />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0D1F4E" />

    <link rel="canonical" href="https://sentientpartners.ai/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sentient Partners | Global Experience. Local Impact." />

      property="og:description"
